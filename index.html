<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mr. Mind">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mr. Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
*{font-variant-ligatures:none;font-feature-settings:"liga" 0}
*{box-sizing:border-box} html,body{margin:0} body{-webkit-tap-highlight-color:transparent} :root{padding-top:env(safe-area-inset-top,0px)}
/* Layout: game HUD. Two header panels on top, the walkable pixel office fills the middle, one unified nav panel at the bottom.
   Dark navy/midnight-purple world, thin neon-violet borders, lime = healthy/done, gold = selected/important. One committed dark look. */
:root{
  --bg:#0b0d1f; --bg2:#120f2a; --panel:#141130; --panel2:#1d1840; --ink:#efeaff; --muted:#a59fca; --line:#3b2f78;
  --violet:#8b5cf6; --violet-soft:rgba(139,92,246,.35); --lime:#a3e635; --gold:#ffc94a; --bad:#ff5d6c; --warn:#ffb547; --idle:#7c86b8; --work:#5ec8ff;
  --r:8px; --b:2px; --h:40px;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#17123a 0%,var(--bg) 60%);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box;max-width:1400px;margin:0 auto}
.panel{background:linear-gradient(180deg,rgba(29,24,64,.92),rgba(20,17,48,.92));border:var(--b) solid var(--line);border-radius:var(--r);box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.04),0 0 18px -8px var(--violet)}
.px{image-rendering:pixelated;shape-rendering:crispEdges;display:inline-block;flex:none}
/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:8px 12px;min-height:var(--h)}
.hdr .logo{width:34px;height:28px}
.hdr h1{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.8vw,30px);line-height:1;margin:0;letter-spacing:.5px;white-space:nowrap}
.hdr h1 span{color:var(--lime);text-shadow:0 0 10px rgba(163,230,53,.45)}
.clock{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;background:var(--bg2);border:var(--b) solid var(--line);border-radius:6px;padding:4px 10px}
.clock small{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.clock .px{width:16px;height:16px}
.info{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 12px;min-height:var(--h);font-size:13px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{font-weight:600} .who span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .dot{width:8px;height:8px;background:var(--lime);box-shadow:0 0 6px var(--lime);flex:none}
.sep{width:2px;align-self:stretch;background:var(--line);margin-block:4px;flex:none}
.next{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
.next .px{width:18px;height:18px}
.next small{color:var(--muted)} .next b{font-family:var(--f-mono);font-weight:600}
.info .right{margin-left:auto;display:flex;gap:6px}
.btn-o{font-family:var(--f-display);font-size:15px;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;background:transparent;color:var(--gold);border:var(--b) solid var(--gold);border-radius:6px;cursor:pointer;transition:background .15s,transform .05s}
.btn-o .px{width:16px;height:16px}
.btn-o:hover{background:rgba(255,201,74,.10)} .btn-o:active{transform:translateY(1px)}
.btn-o[aria-pressed="true"]{background:var(--gold);color:#1b1405}
.btn-i{width:32px;height:32px;display:inline-grid;place-items:center;background:transparent;border:var(--b) solid var(--line);border-radius:6px;cursor:pointer;color:var(--muted)}
.btn-i:hover{border-color:var(--violet);color:var(--ink)} .btn-i .px{width:16px;height:16px}
#sub{display:none}
/* scene */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:var(--r);border:var(--b) solid var(--line);box-shadow:0 0 0 1px #05040d,0 0 30px -10px var(--violet),inset 0 0 40px rgba(0,0,0,.35);background:#16132e}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:pointer}
#stage.edit #cv{cursor:grab}
.tag{position:absolute;transform:translate(-50%,0);background:rgba(11,13,31,.88);border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--ink);font-family:var(--f-mono);font-weight:600;font-size:clamp(10px,1.1vw,12px);letter-spacing:.3px;white-space:nowrap;line-height:1.35;z-index:2;pointer-events:none;display:flex;align-items:center;gap:5px}
.tag i{display:inline-block;width:6px;height:6px}
.tag.you{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(255,201,74,.45)}
.badge{position:absolute;transform:translate(-50%,-50%);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:600 11px/18px var(--f-mono);text-align:center;box-shadow:0 0 0 2px #0b0d1f;z-index:3;pointer-events:auto;cursor:pointer;border:0}
.badge::after{content:"";position:absolute;inset:-12px}
#prompt{position:absolute;transform:translate(-50%,-100%);z-index:4;font-family:var(--f-display);font-size:15px;background:var(--gold);color:#1b1405;border:2px solid #1b1405;border-radius:6px;padding:4px 12px;cursor:pointer;box-shadow:3px 3px 0 #05040d;white-space:nowrap}
#prompt kbd{font-family:var(--f-mono);font-size:11px;background:#1b1405;color:var(--gold);padding:0 5px;border-radius:3px;margin-left:6px}
.help{position:absolute;left:10px;bottom:10px;z-index:3;font-size:12px;color:var(--muted);background:rgba(11,13,31,.86);border:1px solid var(--line);border-radius:6px;padding:5px 9px;max-width:280px}
/* bottom nav */
.nav{display:flex;align-items:stretch;padding:6px;gap:6px}
.nav > button,.nav > .lbl{flex:1}
.nav button{white-space:nowrap;min-width:0;font-family:var(--f-display);font-size:16px;height:42px;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--bg2);color:var(--ink);border:var(--b) solid var(--line);border-radius:6px;cursor:pointer;position:relative;transition:border-color .15s,background .15s,transform .05s}
.nav button .px{width:20px;height:18px}
.nav button:hover{border-color:var(--violet);background:#1a1540} .nav button:active{transform:translateY(1px)}
.nav button.sel{border-color:var(--gold);color:var(--gold)}
.nav .n{font-family:var(--f-mono);font-weight:600;font-size:12px;min-width:22px;height:20px;line-height:20px;border-radius:10px;background:#2a2556;color:var(--muted);padding:0 6px}
.nav .n.hot2{background:var(--bad);color:#fff;box-shadow:0 0 8px rgba(255,93,108,.6)}
#pal{flex-wrap:wrap} #pal button{flex:1 1 auto;font-size:14px;height:36px;padding:0 10px}
#pal .lbl{flex:0 0 auto;align-self:center;font-family:var(--f-mono);font-size:12px;color:var(--gold);padding:0 4px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* card */
#scrim{position:fixed;inset:0;background:rgba(5,4,13,.62);z-index:15}
#card{position:fixed;z-index:16;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));height:min(82vh,660px);display:flex;flex-direction:column;background:linear-gradient(180deg,#1d1840,#141130);border:var(--b) solid var(--violet);border-radius:10px;box-shadow:0 0 0 3px #05040d,0 0 40px -10px var(--violet),8px 8px 0 #05040d}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:var(--b) solid var(--line)}
.card-h canvas{width:44px;height:44px;image-rendering:pixelated;background:var(--bg2);border:1px solid var(--line);border-radius:6px;flex:none}
.card-h h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;line-height:1.1}
.card-h small{display:block;color:var(--muted);font-size:12px}
.card-h .x{margin-left:auto;font-family:var(--f-display);font-size:18px;background:none;border:var(--b) solid var(--line);color:var(--ink);border-radius:6px;width:34px;height:34px;cursor:pointer;flex:none}
.card-h .x:hover{border-color:var(--violet)}
.tabs{display:flex;gap:4px;padding:8px 14px 0;flex-wrap:wrap}
.tabs button{font-family:var(--f-display);font-size:14px;background:none;border:var(--b) solid transparent;border-bottom:none;color:var(--muted);padding:5px 11px;cursor:pointer;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--gold);border-color:var(--line);background:var(--panel2)}
.card-b{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:4px;background:var(--panel2);white-space:nowrap;align-self:flex-start}
.pill i{width:8px;height:8px;display:inline-block}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding-top:3px}
dl.kv dd{margin:0;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-size:20px;color:var(--lime);font-weight:600}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.list li{padding:7px 10px;background:var(--panel2);border-left:3px solid var(--bad);border-radius:4px;font-size:14px}
ul.items li{border-left-color:var(--idle);display:grid;gap:1px}
ul.items li small{color:var(--muted);font-size:12px}
details.sec{background:rgba(11,13,31,.5);border:1px solid var(--line);border-radius:6px}
details.sec summary{cursor:pointer;font-family:var(--f-display);font-size:15px;padding:7px 10px;display:flex;justify-content:space-between}
details.sec ul{padding:0 8px 8px}
input.search,input.say{box-sizing:border-box;width:100%;min-width:0;font:inherit;font-size:15px;background:var(--bg2);color:var(--ink);border:var(--b) solid var(--line);border-radius:6px;padding:7px 10px}
input.search:focus,input.say:focus{outline:none;border-color:var(--gold)}
.empty{color:var(--muted);font-size:14px}
.fix{background:var(--panel2);border-radius:6px;padding:10px 12px;display:grid;gap:6px;border-left:3px solid var(--warn)}
.fix.APPROVED{border-left-color:var(--work)}.fix.DONE{border-left-color:var(--lime)}.fix.DECLINED,.fix.FAILED{border-left-color:var(--idle)}
.fix .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.fix.HOLD{border-left-color:#a78bfa}.fix.OPEN{border-left-color:var(--bad)}
.holdin{flex:1 1 140px;min-width:0;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px}
.fix .plan{font-size:13px;color:var(--muted)} .fix .plan b{color:var(--ink);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.btn,button.btn{display:inline-block;font-family:var(--f-display);font-size:15px;border:var(--b) solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
a.btn:hover,button.btn:hover{border-color:var(--ink)} button.btn:disabled{opacity:.5;cursor:default}
a.btn.yes,button.btn.yes{background:#20330f;border-color:var(--lime);color:#efffd6}
button.btn.no{border-color:var(--bad);color:#ffd9dd}
a.btn.go,button.btn.go{background:#1b2f4a;border-color:var(--work);color:#dff4ff}
button.btn.sm{font-size:13px;padding:3px 9px}
.note{font-size:12px;color:var(--muted);margin:0}
.msg{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--panel2)}
.msg.err{border-left:3px solid var(--bad)} .msg.good{border-left:3px solid var(--lime)}
.chat{display:flex;flex-direction:column;gap:8px;flex:1;min-height:120px;overflow:auto}
.bub{max-width:85%;padding:8px 11px;border-radius:8px;font-size:14px;white-space:pre-wrap;word-wrap:break-word}
.bub.them{background:var(--panel2);align-self:flex-start;border-left:3px solid var(--gold)}
.bub.me{background:#2b2466;align-self:flex-end;border:1px solid var(--violet-soft)}
.sayrow{display:flex;gap:6px}
.chipsq{display:flex;gap:6px;flex-wrap:wrap}
.chipsq button{font-size:12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:3px 10px;cursor:pointer}
.chipsq button:hover{color:var(--ink);border-color:var(--violet)}
.sched{width:100%;border-collapse:collapse;font-size:13px}
.sched td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.sched td.r{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:640px){
  #app{gap:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .hdr{padding:6px 10px} .clock small{display:none}
  .info{gap:8px;padding:6px 6px 6px 10px}
  .who,.info .sep{display:none}
  .next small{display:none}
  #fsBtn{display:none}
  .btn-o .t{display:none} .btn-o{padding:0 8px}
  .nav{gap:5px;padding:5px} .nav button{font-size:14px;gap:5px;height:44px;padding:0 4px} .nav button .px{width:16px;height:15px}
  .help{display:none}
  #card{top:auto;bottom:0;transform:translateX(-50%);width:100%;height:86%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tvtick{position:absolute;z-index:2;overflow:hidden;background:transparent;border:0;padding:0;margin:0;color:#5ef2ff;font-family:var(--f-mono);font-weight:600;white-space:nowrap;display:flex;align-items:center;cursor:pointer;text-shadow:0 0 4px rgba(94,242,255,.8)}
.tvtick span{display:inline-block;padding-left:4px;animation:tvroll 30s linear infinite}
@keyframes tvroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lvbadge{position:absolute;right:8px;bottom:8px;z-index:3;font:600 11px/1 var(--f-mono);color:#ffc94a;background:rgba(11,13,31,.88);border:1px solid #6b5a1e;border-radius:6px;padding:5px 8px;cursor:pointer}
.hqtoast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;max-width:92%;font:600 12px/1.35 var(--f-mono);color:#0b0d1f;background:#ffe27a;border:2px solid #fff3b0;border-radius:8px;padding:8px 12px;box-shadow:0 0 18px rgba(255,214,90,.6);cursor:pointer;text-align:left}
.wxt{margin-left:6px;font-size:11px;opacity:.9}
@media (prefers-reduced-motion: reduce){.tvtick span{animation:none}}

.worldlayer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:2;will-change:transform}
.worldlayer .badge,.worldlayer .tvtick,.worldlayer .brainlbl,.worldlayer #prompt{pointer-events:auto}
.brainlbl{position:absolute;z-index:2;background:transparent;border:0;padding:1px 4px;margin:0;cursor:pointer;display:flex;align-items:flex-start;justify-content:flex-start;color:#c4b5fd;font:600 10px/1.2 var(--f-mono);text-shadow:0 0 4px rgba(167,139,250,.9);overflow:hidden;white-space:nowrap}
.minihint{position:absolute;z-index:3;font:600 11px/1 var(--f-mono);color:#c4b5fd;background:rgba(11,13,31,.7);border:1px solid #3d3480;border-radius:5px;padding:3px 6px;pointer-events:none;transition:opacity .4s}
body.bigmode .hdr{display:none}
body.bigmode #app{gap:5px;padding-block:5px}

.tvtick,.brainlbl{transform-origin:0 0}
.tvtick{justify-content:flex-start}
.help{top:10px;bottom:auto}
.statsbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:5px;background:#e9ecff;border:3px solid #000;box-shadow:0 3px 0 #000}
.statsbar::-webkit-scrollbar{display:none}
.statsbar .st{flex:1 0 auto;display:flex;align-items:center;gap:6px;padding:4px 8px;background:#fff;border:2px solid #1b1d3a;color:#1b1d3a;font:inherit;text-align:left;min-height:36px}
.statsbar button.st{cursor:pointer}.statsbar button.st:hover{background:#fff7d6}.statsbar button.st:focus-visible{outline:2px solid #7c3aed;outline-offset:1px}
.statsbar .ic{font-size:15px;line-height:1}
.statsbar .tx{display:flex;flex-direction:column;line-height:1.1}
.statsbar b{font:700 13px/1 var(--f-mono);color:#2a43c9;font-variant-numeric:tabular-nums}
.statsbar small{font-size:9px;letter-spacing:.4px;text-transform:uppercase;color:#4b4f72}
.statsbar .st.hot b{color:#d9342b}
.zoombox{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:6px}
.zoombox button{width:36px;height:36px;font:700 19px/1 var(--f-mono);cursor:pointer;border:2px solid #000;background:#fff;color:#1b1d3a;box-shadow:2px 2px 0 #000}
.zoombox button:focus-visible{outline:2px solid #ffc94a;outline-offset:2px}
@media (max-width:620px){.statsbar small{font-size:8px}.statsbar b{font-size:12px}.statsbar .st{padding:3px 6px;min-height:32px}}
</style>
</head><body>

<div id="app">
  <header class="panel hdr">
    <span class="px logo" data-icon="brain" aria-hidden="true"></span>
    <h1>Mr. Mind <span>HQ</span></h1>
    <div class="clock" role="timer" aria-label="Chicago time"><span class="px" id="skyIcon" data-icon="moon" aria-hidden="true"></span><small>Chicago</small><span id="clock">--:--</span></div>
  </header>
  <div class="panel info">
    <div class="who"><i class="dot" aria-hidden="true"></i><b>Stick Rivera</b><span>· Liguori Publications</span></div>
    <i class="sep" aria-hidden="true"></i>
    <div class="next"><span class="px" data-icon="calendar" aria-hidden="true"></span><small>Next report</small><b id="nextRep">--</b></div>
    <div class="right">
      <button class="btn-i" id="bellBtn" type="button" aria-label="Notifications" title="Notifications"><span class="px" data-icon="bell" aria-hidden="true"></span></button>
      <button class="btn-i" id="syncBtn" type="button" aria-label="Refresh" title="Refresh"><span class="px" data-icon="sync" aria-hidden="true"></span></button>
      <button class="btn-o" id="editBtn" type="button" aria-pressed="false"><span class="px" data-icon="wrench" aria-hidden="true"></span><span class="t">Decorate</span></button>
    </div>
    <p id="sub"></p>
  </div>

  <main id="stage">
    <canvas id="cv" aria-label="Pixel office you can walk around in. Use arrow keys or tap the floor to walk, E to interact."></canvas>
    <button id="prompt" type="button" hidden></button>
    <div class="help" id="help">Tap the floor (or arrow keys / WASD) to walk. Walk up to someone and press <b>E</b>.</div>
  </main>

  <nav class="panel nav" id="dock" aria-label="Quick open">
    <button type="button" id="dNeeds"><span class="px" data-icon="people" aria-hidden="true"></span>Needs you <span class="n" id="dNeedsN">0</span></button>
    <button type="button" id="dFixes"><span class="px" data-icon="gear" aria-hidden="true"></span>Problems <span class="n" id="dFixesN">0</span></button>
    <button type="button" id="dTeam"><span class="px" data-icon="group" aria-hidden="true"></span>Team</button>
  </nav>
  <nav class="panel nav" id="pal" aria-label="Decorate" hidden>

        const key=await crypto.subtle.importKey("raw",b64u(KEY),"AES-GCM",false,["decrypt"]);
        const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(j.iv)},key,b64u(j.ct));
        const d=JSON.parse(new TextDecoder().decode(pt));
        workers=d.workers||[];hq=d.hq||null;fixes=d.fixes||[];issues=d.issues||[];drawers=d.drawers||{};live={};if(d.graph)fx.setGraph(d.graph);lastSync=d.generatedAt||null;
        try{localStorage.setItem("hq_cache",JSON.stringify(d));}catch(e){}
        rerender();
        if(navigator.setAppBadge){const n=(hq&&hq.needsYou||[]).length;n?navigator.setAppBadge(n).catch(()=>{}):navigator.clearAppBadge().catch(()=>{});}
      }catch(e){
        try{const d=JSON.parse(localStorage.getItem("hq_cache")||"null");if(d){workers=d.workers||[];hq=d.hq||null;fixes=d.fixes||[];issues=d.issues||[];drawers=d.drawers||{};rerender();}}catch(x){}
        if(String(e).includes("OperationError"))showSetup("This phone has an old key. Open your newest setup link.");
      }
    }
    function showSetup(why){opener(()=>card("setup","Connect the app","One-time setup","#ffc94a",[{name:"Setup",render(b){
      b.append(el("p",null,why||"Scan the setup QR code (Desktop › Mr. Mind › app_secrets › phone_setup_QR.png) with this phone's camera. It unlocks your team's data for this app only."));
      b.append(el("p",null,"Already on your home screen? The app can't see what Safari saw, so paste the link here:"));
      const ol=el("ol");["Scan the QR with the Camera app.","Press and hold the yellow link → Copy Link.","Come back to this app, paste below, tap Connect."].forEach(t=>ol.append(el("li",null,t)));b.append(ol);
      const inp=document.createElement("input");inp.type="text";inp.placeholder="Paste the setup link";inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;
      inp.style.cssText="width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:2px solid #ffc94a;background:#0e0b22;color:#fff;font-size:16px";
      const go=el("button","btn go","🔓 Connect");go.type="button";const msg=el("p","note","");
      go.onclick=()=>{const v=(inp.value||"").trim();const m=v.match(/k=([A-Za-z0-9_-]{20,})/)||v.match(/^([A-Za-z0-9_-]{40,})$/);
        if(!m){msg.textContent="That doesn't look like the setup link. Copy the whole link from the QR.";return;}
        try{localStorage.setItem("hqk",m[1]);}catch(e){}msg.textContent="Connected! Loading…";setTimeout(()=>location.reload(),400);};
      b.append(inp,go,msg);
      b.append(el("p","note","Your data is encrypted. Without the setup link nobody can read it, even with the app's address."));}}]));}
    $("syncBtn").onclick=load;
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
    setInterval(load,5*60e3);
    load();
  })();

  // ---------- notifications ----------
  $("bellBtn").onclick=()=>opener(()=>card("notif","Notifications","Get Mr. Mind's alerts like any app","#ffc94a",[{name:"Alerts",render(b){
    const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
    const out=el("div");
    if(!("serviceWorker" in navigator)||!("PushManager" in window)||!standalone){
      b.append(el("p",null,"First put the app on your home screen:"));
      const ol=el("ol");["In Safari tap the Share button (square with an arrow).","Tap “Add to Home Screen”, then Add.","Open Mr. Mind from the new icon and tap this bell again."].forEach(t=>ol.append(el("li",null,t)));b.append(ol);
      b.append(el("p","note","iPhone only allows notifications for apps on the home screen."));return;}
    const st=el("p",null,"Notification status: "+Notification.permission);b.append(st);
    const on=el("button","btn go","🔔 Turn on notifications");on.type="button";b.append(on,out);
    on.onclick=async()=>{on.disabled=true;out.replaceChildren();
      try{const p=await Notification.requestPermission();st.textContent="Notification status: "+p;
        if(p!=="granted"){out.append(el("div","msg err","Notifications are off. Turn them on in Settings → Notifications → Mr. Mind."));on.disabled=false;return;}
        const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
        if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
        const js=JSON.stringify(sub);
        out.append(el("div","msg good","This phone is ready. Last step: send this phone's key to Mr. Mind (one email to yourself)."));
        const send=el("a","btn yes","✉️ Send key to Mr. Mind");send.href=mailto("Mr. Mind: notification key",js);send.style.textDecoration="none";send.style.textAlign="center";out.append(send);
        out.append(el("p","note","After his next run you'll get a test alert, then his reports at 7:30, 12:30 and 5:30."));
      }catch(e){out.append(el("div","msg err","Couldn't turn on notifications: "+(e&&e.message||e)));on.disabled=false;}};
  }}]));
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
